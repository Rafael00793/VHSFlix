<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VHSFLIX - Streaming Retrô</title>
    <!-- Preconectar com os servidores do reprodutor e CDN para acelerar o carregamento e bufferizacao -->
    <link rel="preconnect" href="https://abyssplayer.com" crossorigin />
    <link rel="dns-prefetch" href="https://abyssplayer.com" />
    <link rel="preconnect" href="https://api.hydrax.net" crossorigin />
    <link rel="dns-prefetch" href="https://api.hydrax.net" />
    <link rel="preconnect" href="https://multi.hydrax.net" crossorigin />
    <link rel="dns-prefetch" href="https://multi.hydrax.net" />
    <link rel="preconnect" href="https://play.abyss.to" crossorigin />
    <link rel="dns-prefetch" href="https://play.abyss.to" />
    <script>
      // Ignorar erros benignos do WebSocket e do Vite HMR para não interpor sobreposições ou quebras em tempo de desenvolvimento
      (function() {
        function isBenign(str) {
          if (!str) return false;
          var s = String(str).toLowerCase();
          return s.includes('websocket') || 
                 s.includes('vite') || 
                 s.includes('without opened') || 
                 s.includes('failed to connect') ||
                 s.includes('connection closed');
        }

        window.addEventListener('unhandledrejection', function(event) {
          var reasonStr = event.reason ? (event.reason.message || String(event.reason) || '') : '';
          if (isBenign(reasonStr)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var errorMsg = event.message || (event.error && event.error.message) || String(event) || '';
          if (isBenign(errorMsg)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
